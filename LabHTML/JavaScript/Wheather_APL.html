<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ตัวอย่าง Weather API</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #result { margin-top: 10px; white-space: pre-wrap; font-family: sans-serif; }
    </style>
</head>
<body>

    <h2>ตัวอย่าง Weather API</h2>
    <h3>อำเภอดอยสะเก็ด จังหวัดเชียงใหม่</h3>

    <button id="loadWeather">โหลดข้อมูลสภาพอากาศ</button>
    <pre id="result">กดปุ่มเพื่อโหลดข้อมูล...</pre>

    <script>
        // 1. ดึง element จากหน้าเว็บ
        const button = document.getElementById("loadWeather");
        const result = document.getElementById("result");

        // 2. เมื่อกดปุ่มให้เรียก API
        button.addEventListener("click", async () => {
            
            // URL ของ Open-Meteo (พิกัดดอยสะเก็ด)
            const url = "https://api.open-meteo.com/v1/forecast" +
                        "?latitude=18.878&longitude=99.136" +
                        "&current=temperature_2m,relative_humidity_2m,wind_speed_10m";

            try {
                result.textContent = "กำลังโหลดข้อมูล...";

                // 3. ส่ง request ไปยัง API
                const response = await fetch(url);

                // ตรวจสอบว่าเชื่อมต่อสำเร็จหรือไม่
                if (!response.ok) {
                    throw new Error("ไม่สามารถเชื่อมต่อ API ได้");
                }

                // 4. แปลงข้อมูล JSON เป็น JavaScript Object
                const data = await fetch(url).then(res => res.json());
                const weather = data.current;

                // 5. แสดงผลข้อมูลบนหน้าเว็บ
                result.textContent = 
                    "สถานที่ : อำเภอดอยสะเก็ด จังหวัดเชียงใหม่\n" +
                    "อุณหภูมิ : " + weather.temperature_2m + " °C\n" +
                    "ความชื้น : " + weather.relative_humidity_2m + " %\n" +
                    "ความเร็วลม : " + weather.wind_speed_10m + " km/h\n" +
                    "เวลา : " + weather.time;

                // แสดงโครงสร้างใน Console เพื่อตรวจสอบ (เหมือนในรูปขวาล่าง)
                console.log(data);

            } catch (error) {
                // หากเกิดข้อผิดพลาดให้แสดงข้อความ
                result.textContent = "เกิดข้อผิดพลาด : " + error.message;
            }
        });
    </script>

</body>
</html>
